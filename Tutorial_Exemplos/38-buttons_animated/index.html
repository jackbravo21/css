<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes</title>
    <link rel="stylesheet" type="text/css" href="estilo.css" media="screen" />
</head>
<body>

  <h2>Animated Button</h2>

  <button class="button1" style="vertical-align:middle"><span>Hover </span></button>
  
  <br><br><br>
  <hr>
  <br><br>

  <h2>Animated Button - "Pressed Effect"</h2>

  <h3>Clique no botao para ver o efeito!</h3>

  <button class="button2">Click Me</button>

  <br><br><br>
  <hr>
  <br><br>

  <h2>Animated Button - Fade in Effect</h2>

  <button class="button3">Hover Over Me</button>

  <br><br><br>
  <hr>
  <br><br>

  <h2>Animated Button - Ripple Effect</h2>

  <h3>Clique no botao para ver o efeito!</h3>

  <button class="button4">Click Me</button>

  <br><br><br>
  <hr>
  <br><br>

</body>
</html>
